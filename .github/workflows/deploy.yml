name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: richart-clone-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST_CONFIGURED: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER_CONFIGURED: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY_CONFIGURED: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_FINGERPRINT_CONFIGURED: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
      GRSAI_KEY_CONFIGURED: ${{ secrets.GRSAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify application
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Package source
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        run: |
          archive_name="richart-clone-${{ github.sha }}.tar.gz"
          tar \
            --exclude-vcs \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.env \
            --exclude=.env.local \
          -czf "/tmp/$archive_name" .
          mv "/tmp/$archive_name" "$archive_name"

      - name: Configure deployment SSH
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/richart-clone-deploy"
          chmod 600 "$HOME/.ssh/richart-clone-deploy"
          ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual_fingerprint" = "$DEPLOY_HOST_FINGERPRINT"

      - name: Verify deployment login
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i "$HOME/.ssh/richart-clone-deploy" -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Prepare runtime configuration
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        env:
          GRSAI_API_KEY: ${{ secrets.GRSAI_API_KEY }}
          GRSAI_BASE_URL: ${{ vars.GRSAI_BASE_URL || 'https://grsaiapi.com' }}
          GRSAI_MODEL: ${{ vars.GRSAI_MODEL || 'gemini-3.1-flash-lite' }}
          CONVERSATION_STORE_PATH: /opt/richart-clone/data/conversations.json
        run: |
          umask 077
          {
            printf 'GRSAI_API_KEY=%s\n' "$GRSAI_API_KEY"
            printf 'GRSAI_BASE_URL=%s\n' "$GRSAI_BASE_URL"
            printf 'GRSAI_MODEL=%s\n' "$GRSAI_MODEL"
            printf 'CONVERSATION_STORE_PATH=%s\n' "$CONVERSATION_STORE_PATH"
          } > .richart-clone-runtime.env

      - name: Upload release
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          scp -i "$HOME/.ssh/richart-clone-deploy" -P "$DEPLOY_PORT" -o BatchMode=yes \
            richart-clone-${{ github.sha }}.tar.gz .richart-clone-runtime.env \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Activate release
        if: ${{ env.DEPLOY_HOST_CONFIGURED != '' && env.DEPLOY_USER_CONFIGURED != '' && env.DEPLOY_KEY_CONFIGURED != '' && env.DEPLOY_FINGERPRINT_CONFIGURED != '' && env.GRSAI_KEY_CONFIGURED != '' }}
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i "$HOME/.ssh/richart-clone-deploy" -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RELEASE_SHA'" <<'EOF'
          set -euo pipefail
          release_sha="$1"
          app_dir=/opt/richart-clone
          release_dir="$app_dir/releases/$release_sha"
          archive="/tmp/richart-clone-$release_sha.tar.gz"
          runtime_env=/tmp/.richart-clone-runtime.env

          sudo mkdir -p "$release_dir"
          sudo install -d -o richart -g richart -m 700 /opt/richart-clone/data
          sudo tar -xzf "$archive" -C "$release_dir"
          sudo rm -f "$archive"
          sudo chown -R richart:richart "$release_dir"

          sudo -u richart bash -lc "cd '$release_dir' && npm ci && npm run build"
          sudo install -o richart -g richart -m 600 "$runtime_env" "$release_dir/.env"
          sudo rm -f "$runtime_env"

          sudo ln -sfn "$release_dir" "$app_dir/current"
          sudo systemctl stop richart-clone || true
          sudo fuser -k 3100/tcp || true
          sudo systemctl start richart-clone
          sudo systemctl is-active --quiet richart-clone
          EOF

      - name: Remove runner runtime configuration
        if: ${{ always() }}
        run: rm -f .richart-clone-runtime.env

      - name: Deployment configuration required
        if: ${{ env.DEPLOY_HOST_CONFIGURED == '' || env.DEPLOY_USER_CONFIGURED == '' || env.DEPLOY_KEY_CONFIGURED == '' || env.DEPLOY_FINGERPRINT_CONFIGURED == '' || env.GRSAI_KEY_CONFIGURED == '' }}
        run: 'echo "Deployment skipped: add the required GitHub Actions Secrets described in README.md."'
