name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: richart-clone-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify application
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Package source
        run: |
          tar \
            --exclude-vcs \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.env \
            --exclude=.env.local \
            -czf /tmp/richart-clone-${{ github.sha }}.tar.gz .

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: /tmp/richart-clone-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Activate release
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: RELEASE_SHA,OPENAI_API_KEY,OPENAI_MODEL
          script: |
            set -euo pipefail
            app_dir=/opt/richart-clone
            release_dir="$app_dir/releases/$RELEASE_SHA"
            archive="/tmp/richart-clone-$RELEASE_SHA.tar.gz"

            sudo mkdir -p "$release_dir"
            sudo tar -xzf "$archive" -C "$release_dir"
            sudo rm -f "$archive"
            sudo chown -R richart:richart "$release_dir"

            sudo -u richart bash -lc "cd '$release_dir' && npm ci && npm run build"
            sudo install -o richart -g richart -m 600 /dev/null "$release_dir/.env"
            sudo tee "$release_dir/.env" >/dev/null <<EOF
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENAI_MODEL=$OPENAI_MODEL
            EOF
            sudo chown richart:richart "$release_dir/.env"

            sudo ln -sfn "$release_dir" "$app_dir/current"
            sudo systemctl restart richart-clone
            sudo systemctl is-active --quiet richart-clone
